# The module's Robolectric defaults, read for every test in it.
#
# sdk: without this a test falls back to targetSdk, and SDK 36's sandbox requires Java 21. A
# contributor on JDK 17 would see such a test die before its body runs. RobolectricDefaultsTest
# asserts it.
sdk=34
#
# application: the real one schedules WorkManager on create. A test that wants it says so.
application=android.app.Application
