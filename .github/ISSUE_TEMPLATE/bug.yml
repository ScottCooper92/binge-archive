name: Bug report
description: Something in the app does not work as it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        This issue is public. Do not include anyone's name or account details.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: film
    attributes:
      label: Film
      description: The film's title and year, or its TMDB id, if the bug is about one film.
      placeholder: Nosferatu (1922)
  - type: input
    id: app-version
    attributes:
      label: App version
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and Android version
